[versions]
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"
appcompat = "1.8.0"
coreKtx = "1.19.0"
room = "2.8.4"
coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
desugarJdkLibs = "2.1.5"
jsoup = "1.23.2"
androidxLegacy = "1.0.0"
androidxConstraintlayout = "2.2.2"
androidxRecyclerview = "1.4.0"
androidxNavigation = "2.10.0"
androidxPreferenceKtx = "1.2.1"
googleMaterial = "1.14.0"
androidxViewpager2 = "1.1.0"
androidxLifecycleLivedataKtx = "2.11.0"
androidxDocumentfile = "1.1.0"
androidxDatastorePreferences = "1.2.1"
kpermissions = "3.5.0"
anggrayudiStorage = "3.0.1"
materialDialogs = "3.3.0"
nextcloudSso = "1.3.4"
retrofit = "3.0.0"
