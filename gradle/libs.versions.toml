[versions]
# Confirmed stable as of 2026-09-01 (https://developer.android.com/build/releases/agp-9-4-0-release-notes).
# Requires Gradle 9.6.0+ minimum -- satisfied by this project's 9.7.1 wrapper.
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.09.00" # TODO: verify against https://developer.android.com/develop/ui/compose/setup-compose-dependencies-and-compiler
# KSP versions are decoupled from the Kotlin compiler version as of KSP 2.3+.
# Verify current version at https://github.com/google/ksp/releases
ksp = "2.3.10"

# Below this line: real, recently-current version numbers used as a
# reasonable starting point, NOT independently verified against a live
# source. Android Studio will likely flag a newer version being
# available on first sync -- worth accepting that suggestion rather
# than treating these as pinned-for-a-reason.
activityCompose = "1.13.0"
appcompat = "1.8.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
room = "2.8.4"
coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
desugarJdkLibs = "2.1.5"
jsoup = "1.23.2"
androidxLegacy = "1.0.0" # shared by legacy-support-v4 and legacy-preference-v14, which are pinned to the same version
androidxConstraintlayout = "2.2.2"
androidxRecyclerview = "1.4.0"
androidxNavigation = "2.10.0" # shared by navigation-fragment-ktx and navigation-ui-ktx
androidxPreferenceKtx = "1.2.1" # was "2.10.0" -- that version doesn't exist; Preference has never gone past 1.2.x. Looks like it got cross-contaminated from navigation-fragment-ktx/navigation-ui-ktx, which really are at 2.10.0. Confirmed 1.2.1 as the last independently-verified release; check for newer.
googleMaterial = "1.14.0"
androidxViewpager2 = "1.1.0"
androidxLifecycleLivedataKtx = "2.11.0"
androidxDocumentfile = "1.1.0"
androidxDatastorePreferences = "1.2.1"
kpermissions = "3.5.0"
anggrayudiStorage = "3.0.1"
materialDialogs = "3.3.0"
nextcloudSso = "1.3.4" # was "0.8.1" -- confirmed stale via a sibling Nextcloud Android app pinning 1.3.4; verify current latest at https://jitpack.io/#nextcloud/Android-SingleSignOn
retrofit = "3.0.0"
nextcloudCommonsSsoGlide = "2.3.5" # was "1.8.2" -- confirmed stale via nextcloud-commons' own current README usage example; verify current latest at https://jitpack.io/#stefan-niedermann/nextcloud-commons
glide = "5.0.9"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "androidxLegacy" }
androidx-legacy-preference-v14 = { group = "androidx.legacy", name = "legacy-preference-v14", version.ref = "androidxLegacy" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidxNavigation" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "androidxPreferenceKtx" }
# named "material" (not nested under a hypothetical "google-material") to match common convention;
# material-dialogs-core below is deliberately a FLAT key (no dashes) so it doesn't nest under
# libs.material and collide with this leaf entry -- same issue as the kotlin-stdlib/kotlin-stdlib-jdk8 case.
material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidxViewpager2" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLifecycleLivedataKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentfile" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastorePreferences" }
kpermissions = { module = "com.github.fondesa:kpermissions", version.ref = "kpermissions" }
anggrayudi-storage = { module = "com.anggrayudi:storage", version.ref = "anggrayudiStorage" }
materialDialogsCore = { group = "com.afollestad.material-dialogs", name = "core", version.ref = "materialDialogs" }
nextcloud-sso = { module = "com.github.nextcloud:Android-SingleSignOn", version.ref = "nextcloudSso" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
nextcloud-commons-sso-glide = { module = "com.github.stefan-niedermann.nextcloud-commons:sso-glide", version.ref = "nextcloudCommonsSsoGlide" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
