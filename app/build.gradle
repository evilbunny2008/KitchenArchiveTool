buildscript {
   repositories {
      mavenCentral()
   }

   dependencies {
      classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
   }
}

plugins {
   id "com.android.application"
   id "kotlin-android"
   id "androidx.navigation.safeargs.kotlin"
   id "kotlin-kapt"
}
apply plugin: 'kotlinx-serialization'

android {
   defaultConfig {
      applicationId "com.odiousapps.nextcloudcookbook"
      minSdk 29
      targetSdk 37
      versionCode 302
      versionName "4.0.0"

      testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
      vectorDrawables.useSupportLibrary = true
      multiDexEnabled true
   }

   buildTypes {
      release {
         minifyEnabled true
         shrinkResources true
         proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      }
      debug {
         applicationIdSuffix '.debug' // erweitere Package
         versionNameSuffix ' [DEBUG]' // erweitere Versions-Name
      }
   }
   compileOptions {
      coreLibraryDesugaringEnabled true
      sourceCompatibility = JavaVersion.VERSION_11
      targetCompatibility = JavaVersion.VERSION_11
   }
   buildFeatures {
      viewBinding true
      dataBinding true
   }
   lint {
      disable 'MissingTranslation'
   }
   namespace 'com.odiousapps.nextcloudcookbook'
}

dependencies {
   implementation fileTree(dir: "libs", include: ["*.jar"])
   implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21"

   implementation "org.jsoup:jsoup:1.23.2"

    implementation "androidx.core:core-ktx:1.19.0"
   implementation "androidx.legacy:legacy-support-v4:1.0.0"
   implementation "androidx.appcompat:appcompat:1.8.0"
   implementation "androidx.constraintlayout:constraintlayout:2.2.2"
   implementation "androidx.recyclerview:recyclerview:1.4.0"
   implementation "androidx.navigation:navigation-fragment-ktx:2.10.0"
   implementation "androidx.navigation:navigation-ui-ktx:2.10.0"
   implementation "androidx.preference:preference-ktx:$version_preference"
   implementation "androidx.legacy:legacy-preference-v14:1.0.0"
   // material design and viewpager2
   implementation "com.google.android.material:material:1.14.0"
   implementation "androidx.viewpager2:viewpager2:1.1.0"
   // Lifecycle dependencies
   //implementation "androidx.lifecycle:lifecycle-extensions:$version_lifecycle_extensions"
   implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
   // Coroutines
   implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
   implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
   // room database
   implementation "androidx.room:room-runtime:2.8.4"
   // optional - Kotlin Extensions and Coroutines support for Room
   implementation "androidx.room:room-ktx:2.8.4"
   // storage access framework (SAF)
   implementation "androidx.documentfile:documentfile:1.1.0"
   // datastore for settings
   implementation "androidx.datastore:datastore-preferences:1.2.1"

   // Json parser
   implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$version_serialization"

   //noinspection GradleDependency
   coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

   // permissions
   implementation 'com.github.fondesa:kpermissions:3.5.0'
   // simple storage
   implementation 'com.anggrayudi:storage:3.0.1'
   implementation 'com.afollestad.material-dialogs:core:3.3.0'

   //nextcloud api
   implementation "com.github.nextcloud:Android-SingleSignOn:0.8.1"
   implementation 'com.squareup.retrofit2:retrofit:3.0.0'
   implementation 'com.github.stefan-niedermann.nextcloud-commons:sso-glide:1.8.2'

   implementation 'com.github.bumptech.glide:glide:5.0.9'
}
