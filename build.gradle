import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
   ext {
      kotlin_version = '1.9.0'
      version_navigation = '2.7.7'
      version_lifecycle_extensions = '2.2.0'
      version_coroutine = '1.7.3'
      version_preference = '1.2.1'
      version_jackson = '2.11.0'
      version_recyclerview = '1.3.2'
      version_cardview = '1.0.0'
      version_constraintlayout = '2.1.4'
      version_appcompat = '1.6.1'
      version_material = '1.11.0'
      version_viewpager2 = '1.1.0-beta02'
      version_room = '2.6.1'
      version_serialization = '1.5.0'
      version_document = '1.0.1'
      version_datastore = "1.0.0"
   }

   repositories {
      google()
      mavenCentral()
      maven { url "https://jitpack.io" }
   }
   dependencies {
      classpath 'com.android.tools.build:gradle:8.2.2'
      //noinspection DifferentKotlinGradleVersion
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
      classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$version_navigation"
   }
}

plugins {
   id 'com.google.devtools.ksp' version "${kotlin_version}-1.0.13" apply false
}

allprojects {
   repositories {
      google()
      mavenCentral()
      maven { url "https://jitpack.io" }
   }

   //Support @JvmDefault
   tasks.withType(KotlinCompile).configureEach {
      kotlinOptions {
         freeCompilerArgs = ['-Xjvm-default=all', '-Xopt-in=kotlin.RequiresOptIn']
         jvmTarget = '11'
         //includeRuntime = true
      }
   }
}

wrapper {
   gradleVersion = "8.1"
}

tasks.register('clean', Delete) {
   delete rootProject.buildDir
}
